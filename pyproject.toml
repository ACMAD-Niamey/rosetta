[project]
name = "rosetta"
version = "0.2.0"
description = "Canonical data acquisition for seasonal climate forecasting"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "numpy",
    "netcdf4",
    "pyyaml",
    "scipy",
    "cdsapi>=0.7.7",
    "ecmwf-api-client>=1.6",
    "tqdm",
    "rioxarray",
    "sheerwater>=0.2.5",
    "nuthatch>=0.4.9",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.46.2.19",
    # icechunk (versioned Zarr stores) is a default dep so the icechunk adapter
    # never fails lazily at fetch time. It requires zarr>=3. sheerwater's
    # metadata hard-pins zarr==2.18.3, but that pin is stale -- sheerwater reads
    # through xarray's (version-agnostic) zarr backend and opens+reads its public
    # stores fine under zarr 3 (verified by tests/test_sheerwater_integration.py
    # against real data). We force zarr>=3 past that pin via the [tool.uv]
    # override-dependencies below so both adapters resolve into one environment.
    "icechunk>=2",
]

[project.optional-dependencies]
s3 = ["boto3"]
dev = ["pytest"]
demo = ["matplotlib", "cartopy", "rasterio"]
# Shapefile / geometry region input (rosetta.fetch(region="x.shp")). rioxarray
# is already a core dep and rasterio rides in with it; geopandas is the only
# genuinely new requirement, kept optional because its stack is heavy.
geo = ["geopandas", "rasterio"]

[project.scripts]
rosetta = "rosetta.cli:cli"

[tool.uv]
# sheerwater's metadata hard-pins zarr==2.18.3, which blocks icechunk (needs
# zarr>=3) from co-resolving into the same environment. That pin is stale:
# sheerwater opens+reads its public Zarr stores correctly under zarr 3, verified
# end-to-end against real data by tests/test_sheerwater_integration.py. Override
# it so the icechunk and sheerwater adapters can live in one resolved env.
override-dependencies = ["zarr>=3.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access",
    "cds: requires CDS credentials in ~/.cdsapirc",
    "network: requires live network access to remote data sources",
]

[tool.nuthatch]
# V1: root and local both point to the same local filesystem path.
# Public mirror is a V2 item.
[tool.nuthatch.root]
filesystem = "~/.nuthatch/rosetta"
[tool.nuthatch.local]
filesystem = "~/.nuthatch/rosetta"
