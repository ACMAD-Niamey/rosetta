[project]
name = "rosetta"
version = "0.1.0"
description = "Canonical data acquisition for seasonal climate forecasting"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "numpy",
    "netcdf4",
    "pyyaml",
    "scipy",
    "cdsapi>=0.7.7",
    "tqdm",
    "rioxarray",
    "sheerwater>=0.2.5",
    "nuthatch>=0.4.9",
]

[project.optional-dependencies]
s3 = ["boto3"]
dev = ["pytest"]
demo = ["matplotlib", "cartopy", "rasterio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access",
    "cds: requires CDS credentials in ~/.cdsapirc",
]
