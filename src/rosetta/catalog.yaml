# ---------------------------------------------------------------------------
# CHIRPS (UCSB Climate Hazards Center precipitation)
#
# Naming convention: obs/chirps-{version}-{cadence}[-rhiza]
#   - Native UCSB products carry only version + cadence
#     (e.g. obs/chirps-v3-monthly). Native data is 0.05°, 1981-present
#     (daily v3 starts 1998), served as COG (monthly), per-year NetCDF
#     (daily/pentad/dekad), or GeoTIFF (annual).
#   - Rhiza Research / Sheerwater mirrors end in -rhiza: a regridded 0.25°
#     copy on public GCS as Zarr. Convenient and cheap to crop, but NOT the
#     native record (coarser grid; chirps_v3 only covers 2000+).
# Sub-monthly native cadences are one NetCDF per year, fetched whole then
# cropped (no server-side subsetting), so they are bandwidth-heavy.
#
# Throttling: data.chc.ucsb.edu sits behind nginx + CrowdSec, which bans an IP
# for 4 hours (HTTP 403, "CrowdSec Ban") once it exceeds ~2 requests/sec to
# non-static files (leaky bucket: capacity 40, leak 2/s). There is no published
# UCSB rate limit and robots.txt disallows crawling, so that scenario is the
# real ceiling. Each native entry therefore declares a request_interval floor
# (seconds between file opens; callers may pass a larger fetch(request_interval=)
# but cannot go below it). COG/TIF do several HTTP range reads per file, so they
# pace harder than the whole-file NetCDFs. Rule of thumb for a bulk regional
# pull: keep (range-reads-per-file / request_interval) under 2 — i.e. raise
# request_interval for large/continental domains (≈ tiles_per_file / 2 seconds).
# The NetCDF cadences also cap concurrent connections via max_workers, since one
# pull can open several multi-GiB downloads at once (v3-daily is ~23.5 GiB/file).
# ---------------------------------------------------------------------------

# --- Native UCSB CHIRPS v2.0 (0.05°) ---
obs/chirps-v2-monthly:
  adapter: http
  source_url: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_monthly/cogs/"
  file_pattern: "chirps-v2.0.{year}.{month:02d}.cog"
  format: cog
  request_interval: 3.0   # COG range reads; floor keeps bulk pulls under CrowdSec ~2 req/s
  variables:
    precip:
      native_name: precip
      units: "mm/month"
      target_units: "mm/day"
      fill_value: -9999
  grid:
    lat_res: 0.05
    lon_res: 0.05
    hindcast_range: [1981, 2025]
    temporal: monthly
