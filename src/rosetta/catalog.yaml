  source_url: "https://www.ncei.noaa.gov/data/north-american-multi-model-ensemble/access/gemnemo"
  file_regex: "{var}_daily_gemnemo\\.{init}_{member}_.*\\.nc"
  member_list: ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10"]
  variables:
    precip:
