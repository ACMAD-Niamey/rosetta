# NCEI NMME archive — ccsm4 / geoss2s / gemnemo (2018+ only, no hindcasts).
# PROVENANCE: archive. NOAA NCEI re-hosts NMME output; it is an archive, not the
# producing center (NCAR/COLA, NASA-GMAO, ECCC). Used because these older models
# have no convenient live producing-center feed. Same provenance class as the
# CCSR entries below; see the SPEAR block for the original-vs-mirror rationale.
# https://www.ncei.noaa.gov/data/north-american-multi-model-ensemble/access/

nmme/ccsm4:
  adapter: ncei
  source_url: "https://www.ncei.noaa.gov/data/north-american-multi-model-ensemble/access/ccsm4"
  file_regex: "{var}_day_ccsm4_{init}_{member}_.*\\.nc"
  member_list: ["r1i1p1", "r2i1p1", "r3i1p1", "r4i1p1", "r5i1p1",
                "r6i1p1", "r7i1p1", "r8i1p1", "r9i1p1", "r10i1p1"]
  variables:
    precip:
      native_name: pr
      units: "m/s"
      target_units: "mm/day"
    temp:
      native_name: tasmax
      short_name: TREFMXAV
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    members: 10
    hindcast_range: null

nmme/geoss2s:
  adapter: ncei
  source_url: "https://www.ncei.noaa.gov/data/north-american-multi-model-ensemble/access/geos-5"
  file_regex: "{var}_daily_geos-5\\.{init}09_{member}_.*\\.nc"
  member_list: ["E1", "E2", "E3", "E4"]
  time_fix: "geos5_year"
  variables:
    precip:
      native_name: pr
      units: "kg m-2 s-1"
      target_units: "mm/day"
    temp:
      native_name: tasmax
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    members: 4
    hindcast_range: null

nmme/gemnemo:
