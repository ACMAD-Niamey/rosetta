# CHIRPS preliminary live feed via Rhiza/Sheerwater's chirps_raw_live.
# Daily values (no aggregation parameter — caller must aggregate to
# dekads downstream). ~8-day lag from the present (vs. ~3-week lag of
# chirps_v2). Used by the deepscale S2S testbed for recent-obs scoring
# when the finalized v2 data hasn't caught up yet. Lineage (v2 vs v3
# prelim) not yet confirmed, so the name carries no version token.
obs/chirps-live-rhiza:
  adapter: sheerwater
  source: chirps.chirps_raw_live
  source_kwargs:
    recompute: true     # actually compute live data (not strict read-from-cache)
    cache_mode: write   # write the fetched data into the local cache
  variables:
    precip:
      native_name: precip
      units: "mm/day"
      target_units: "mm/day"
      # Raw CHIRPS uses -9999 as the ocean / missing-data sentinel. The
      # chirps_raw_live path doesn't apply sheerwater's land-sea mask, so
      # the sentinel reaches us literally. normalize converts it to NaN
      # so downstream aggregations skip ocean cells correctly.
      fill_value: -9999
  grid:
    lat_res: 0.05  # CHIRPS native resolution
    lon_res: 0.05
    temporal: daily
  notes: "Rhiza Research / Sheerwater chirps_raw_live preliminary near-real-time feed (~8-day lag). Mirror of UCSB CHIRPS prelim. Was obs/chirps-live."

c3s/ecmwf-monthly:
  adapter: cds
  cds_dataset: "seasonal-monthly-single-levels"
  cds_model: "ecmwf"
  system: "51"
  product_type: "monthly_mean"
  leadtime_month: [1, 2, 3, 4, 5, 6]
  variables:
    precip:
      native_name: total_precipitation
      short_name: tprate
      units: "m s-1"
      target_units: "mm/day"
    temp:
      native_name: 2m_temperature
      short_name: t2m
      units: K
      target_units: C
    sst:
      native_name: sea_surface_temperature
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
  members: 25
  hindcast_range: [1993, 2016]

c3s/ecmwf-seas51c:
  adapter: iridl
  deprecated_after: "2026-04-30"
  successor: "c3s/ecmwf-monthly"
  iridl_path: "SOURCES/.EU/.Copernicus/.CDS/.C3S/.ECMWF/.SEAS51_iri2/.appended"
  variables:
    precip:
      iridl_name: prcp
      native_name: prcp
      units: "mm/day"
      target_units: "mm/day"
      iridl_unit_ops: "c%3A/1000/(mm%20m-1)/%3Ac/mul/c%3A/86400/(s%20day-1)/%3Ac/mul"
    sst:
      native_name: sst  # IRI OPeNDAP variable name — differs from CDS "sea_surface_temperature"
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
  members: 25
  hindcast_range: [1993, 2016]

c3s/ecmwf-s2s:
  adapter: cds
  cds_dataset: "s2s-forecasts"
  # ECMWF Climate Data Store (separate endpoint from Copernicus CDS). Override
  # if you have a single .cdsapirc that points at a different endpoint.
  cds_url: "https://ecds.ecmwf.int/api"
  cds_model: "ecmwf"               # threaded into request as `origin`
  forecast_type: "perturbed_forecast"
  level_type: "single_level"       # required by ECDS; without it MARS finds nothing
  variables:
    precip:
      native_name: total_precipitation
      short_name: tp
      # Despite ECMWF docs saying "m", empirical inspection of returned
      # data (both the CDS NetCDF and the MARS GRIB) shows values are
      # actually in kg m**-2 (= mm). The (m, mm/day) conversion would
      # over-scale by 1000x. Declaring mm here makes the after-deaccumulation
      # 24h-step value pass through identity → mm/day numerically.
      units: mm
      target_units: "mm/day"
      accumulated: true
    sst:
      native_name: sea_surface_temperature
      units: K
      target_units: K
  grid:
    lat_res: 1.5
    lon_res: 1.5
  members: 50                      # perturbed ensemble; control adds 1
  # Hindcast availability depends on the issuance date — ECMWF S2S provides
  # on-the-fly reforecasts for the same calendar week, not a static range.

obs/era5:
  adapter: cds
  cds_dataset: "reanalysis-era5-single-levels-monthly-means"
  product_type: "monthly_averaged_reanalysis"
  # Single-level ERA5 monthly means. precip + sst added (§7 / Decision 5b) so
  # ERA5 is broadly usable, not temp-only. Pressure-level fields (z500, u850,
  # v850) live in a different CDS dataset and would be a separate
  # obs/era5-pressure entry (follow-up) — they are not in single-levels.
  variables:
    temp:
      native_name: 2m_temperature
      short_name: t2m
      units: K
      target_units: C
    precip:
      native_name: total_precipitation
      short_name: tp
      units: m
      target_units: "mm/day"
    sst:
      native_name: sea_surface_temperature
      short_name: sst
      units: K
      target_units: C
  grid:
    lat_res: 0.25
    lon_res: 0.25

obs/era5-land-monthly:
  adapter: cds
  cds_dataset: "reanalysis-era5-land-monthly-means"
  product_type: "monthly_averaged_reanalysis"
  # Higher-resolution (0.1°) land reanalysis, 1950-present. The land sibling of
  # obs/era5 (single-levels, 0.25°) — used as the reference/truth for scoring
  # downscaled precip (e.g. the SaWaM SEAS5-BCSD product). Land-only, so no SST.
  # Same CDS request shape as obs/era5 (monthly_averaged_reanalysis), so no
  # adapter changes. tp uses the same m→mm/day (×1000) convention as obs/era5.
  # Cadence is explicit in the name (per the CHIRPS naming convention); daily
  # (derived-era5-land-daily-statistics) and hourly (reanalysis-era5-land) are
  # separate CDS datasets with different request shapes — future entries.
  variables:
    precip:
      native_name: total_precipitation
      short_name: tp
      units: m
      target_units: "mm/day"
    temp:
      native_name: 2m_temperature
      short_name: t2m
      units: K
      target_units: C
  grid:
    lat_res: 0.1
    lon_res: 0.1

# GFDL SPEAR / SPEARb (precip, temp, SST) via the Columbia CCSR successor (#14).
#
# PROVENANCE: mirror. CCSR (forecast.ccsr.columbia.edu) is an *aggregator* — the
# IRI Data Library replacement — not the producing center. Rosetta prefers
# original sources, so strictly the original here is GFDL (NOAA Open Data
# Dissemination / GFDL THREDDS); if/when that adapter is built it should live
# under its own channel, e.g. `gfdl/spear`, and this entry stays as the NMME-
# program copy. CCSR is used because it is clean, standard OPeNDAP with NO
# coupling to the old PyCPT-DL / IRI Ingrid stack (the CCSR adapter opens it
# with stock xarray). The `nmme/` prefix denotes the NMME aggregated
# distribution, which CCSR now is — so this naming is correct as-is.
#
# Adapter notes: plain-DAP URLs; the CCSR adapter decodes the "hours since 1960"
# init axis and uses the self-describing target[S,L] variable for season
# selection. Native CCSR variable names: prcp / t2m / sst. SPEARb SST is served
# as SPEAR/sst (no separate SPEARb directory at CCSR).
nmme/spear:
  adapter: ccsr
  source_url: "https://forecast.ccsr.columbia.edu/data/NMME/NOAA-GFDL/SPEAR/forecast"
  variables:
    precip:
      native_name: prcp
      # CCSR serves monthly-TOTAL precip (mm/month), not a daily rate — verified
      # 2026-06-04 via metadata (units attr "mm") + magnitude (EA MAM mean ~87 mm).
      # MME output is in the predictand's units (CHIRPS mm/day) and CCA is
      # scale-invariant, so this does not affect §8; the label is just honest.
      units: "mm"
      target_units: "mm"
    temp:
      native_name: t2m
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    members: 15
    hindcast_range: [1991, 2020]

nmme/spear-hindcast:
  adapter: ccsr
  source_url: "https://forecast.ccsr.columbia.edu/data/NMME/NOAA-GFDL/SPEAR/hindcast"
  variables:
    precip:
      native_name: prcp
      # CCSR serves monthly-TOTAL precip (mm/month), not a daily rate — verified
      # 2026-06-04 via metadata (units attr "mm") + magnitude (EA MAM mean ~87 mm).
      # MME output is in the predictand's units (CHIRPS mm/day) and CCA is
      # scale-invariant, so this does not affect §8; the label is just honest.
      units: "mm"
      target_units: "mm"
    temp:
      native_name: t2m
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    members: 15
    hindcast_range: [1991, 2020]

