nmme/cfsv2:
  adapter: opendap
  deprecated_after: "2026-04-30"
  successor: null
  # NOTE: This uses PENTAD_SAMPLES/.MONTHLY which returns 28 members and all
  # 10 lead months per init.  When rosetta.fetch() is called with init= and
  # target=, the OPeNDAP adapter automatically selects and averages only the
  # 3 leads corresponding to the target season (L = lead_month - 0.5).
  #
  # KNOWN ISSUE: pycpt/IRI uses PENTAD_SAMPLES_FULL (a different sub-collection)
  # with server-side member averaging.  The two datasets can diverge spatially
  # for predictor domains that include ocean/Atlantic cells (e.g. W Africa),
  # causing r(DS_gcm, IRI_gcm) < 1 and reduced cross-pipeline CCA agreement.
  # TODO: Switch source_url to PENTAD_SAMPLES_FULL once the OPeNDAP adapter
  # supports the required server-side lead + member averaging for that endpoint.
  source_url: "https://iridl.ldeo.columbia.edu/SOURCES/.Models/.NMME/.NCEP-CFSv2/.HINDCAST/.PENTAD_SAMPLES/.MONTHLY"
  variables:
    precip:
      native_name: prec
      units: "mm/day"
      target_units: "mm/day"
    temp:
      native_name: tref
      units: K
      target_units: C
    sst:
      native_name: sst
      units: K
      target_units: K
  grid:
    lat_res: 1.0
    lon_res: 1.0
    members: 28  # PENTAD_SAMPLES/.MONTHLY returns 28 members (not 24)
    hindcast_range: [1982, 2010]

nmme/cfsv2-forecast:
  adapter: opendap
  deprecated_after: "2026-04-30"
  successor: null
  source_url: "https://iridl.ldeo.columbia.edu/SOURCES/.Models/.NMME/.NCEP-CFSv2/.FORECAST/.PENTAD_SAMPLES/.MONTHLY"
  variables:
    precip:
